services:
  # Apollo GraphQL Backend
  - type: web
    name: delight-graphql-api
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false  # Will be set manually from Render PostgreSQL
      - key: LIFE_SCORE_URL
        sync: false  # Set to your life-score frontend URL
      - key: API_URL
        sync: false  # Set to your API URL (e.g., https://api.vibecheck.app)
      # Push notifications (APNs .p8 auth key from developer.apple.com). Optional: sends are skipped without them.
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false  # Contents of the .p8 file
      - key: APNS_BUNDLE_ID
        value: app.vibecheck.ios
